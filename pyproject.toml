[project]
name = "qlab"
version = "0.1.0"
description = "QLab interface for Python"
readme = "README.md"
authors = [{ name = "Harpo", email = "harpo@harpo.me" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "python-osc>=1.8.3",
  "pydantic>=2.8.2",
  "fountain>=0.1.3",
  "sqlmodel>=0.0.27",
  "showrunner",
]

[dependency-groups]
dev = ["rich>=14.2.0"]

[project.entry-points."showrunner"]
qlab = "qlab.showrunner:plugin"


[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
[tool.uv.sources]
fountain = { git = "https://github.com/quaternionmedia/fountain", branch = "deduplicate" }
showrunner = { path = "../ShowRunner", editable = true }
