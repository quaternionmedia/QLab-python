[project]
name = "qlab-python"
version = "0.1.0"
description = "QLab interface for Python"
authors = [{ name = "Quaternion Media, LLC", email = "harpo@quaternion.media" }]
dependencies = [
    "python-osc>=1.8.3",
    "pydantic>=2.8.2",
    "fountain>=0.1.3",
    "sqlmodel>=0.0.27",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pdm]
distribution = true

[tool.uv.sources]
fountain = { git = "https://github.com/quaternionmedia/fountain", branch = "deduplicate" }

[dependency-groups]
dev = ["rich>=14.2.0"]
